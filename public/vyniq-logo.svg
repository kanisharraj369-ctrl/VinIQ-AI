<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="vyniq-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="40%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="vyniq-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="vyniq-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.3" />
    </linearGradient>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glow backdrop -->
  <circle cx="120" cy="110" r="85" fill="url(#vyniq-glow)" opacity="0.4" filter="url(#subtle-glow)" />

  <!-- Left Wing (Violet / Purple facet) -->
  <path
    d="M 46 44 
       L 92 44 
       L 68 116 
       L 94 92 
       L 120 178 
       L 86 178 
       L 46 44 Z"
    fill="url(#vyniq-purple)"
  />

  <!-- Right Wing (Electric Cyan / Sky Blue facet) -->
  <path
    d="M 194 44 
       L 148 44 
       L 124 94 
       L 148 94 
       L 120 178 
       L 154 178 
       L 194 44 Z"
    fill="url(#vyniq-blue)"
  />
  
  <!-- Right Top Arrow/Accent Hook -->
  <path
    d="M 148 44
       L 116 44
       L 138 94
       L 162 94
       Z"
    fill="#38BDF8"
    opacity="0.95"
  />
</svg>
